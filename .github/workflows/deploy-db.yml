name: Deploy database

# Applies new migrations to the hosted Supabase project whenever they land on
# main, so nobody has to run `supabase db push` from a laptop. The CI
# `database` job has already tested them on the pull request.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

# Never run two pushes against the same database at once.
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      # Repository secrets (Settings > Secrets and variables > Actions).
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Supabase secrets are not set; skipping the database deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.secrets.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.122.0
      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Show pending migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase migration list
      - name: Push migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push
