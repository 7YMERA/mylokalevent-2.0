name: Publish wiki

# The wiki pages live in docs/wiki/ so they are reviewed in pull requests like
# everything else. When they change on main, this copies them to the GitHub
# wiki, replacing what is there (edits made in the wiki's web editor are
# overwritten).
on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

concurrency:
  group: wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push docs/wiki to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Publish wiki from ${GITHUB_SHA::7}"
          git push
